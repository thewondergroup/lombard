name: Update journal

# Pulls new and edited posts from the journal Google Sheet and rebuilds the journal pages.
on:
  schedule:
    - cron: "17 * * * *"   # every hour
  workflow_dispatch:         # "Run workflow" button in the Actions tab publishes straight away
  push:
    paths:
      - scripts/journal-config.json

permissions:
  contents: write

concurrency:
  group: journal
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python3 scripts/journal.py
      - name: Commit changes
        run: |
          git config user.name "1 Lombard Street journal"
          git config user.email "actions@users.noreply.github.com"
          git add -A post journal.html images/journal data sitemap.xml llms.txt
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "Journal update" && git push; fi
